<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Artemis — Checkout</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,500&family=Archivo:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <nav class="nav">
    <div class="wrap">
      <a class="brand" href="/"><span class="moon"></span> Artemis</a>
    </div>
  </nav>

  <main class="auth-wrap">
    {% if ordered %}
    <div class="auth">
      <h2>Order placed</h2>
      <p class="sub">Your pieces are on their way by moonlight.</p>
      <a class="btn gold" href="{{ url_for('index') }}">Back to shop</a>
    </div>
    {% else %}
    <form class="auth" action="{{ url_for('checkout') }}" method="post">
      <h2>Checkout</h2>
      <p class="sub">Enter payment to place your order.</p>
      {% if error %}<p class="err">{{ error }}</p>{% endif %}
      <label>Card number<input type="text" name="card" placeholder="4111 1111 1111 1111"></label>
      <button class="btn gold" type="submit">Pay now</button>
    </form>
    {% endif %}
  </main>
</body>
</html>
